<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prozesslandkarte · Autohaus Stieber</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--blau:#007BFF;--ink:#1A2333;--sek:#4A5F78;--rahmen:#E3E9F2;--hell:#F4F8FD;--rot:#EC1C24}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--hell);color:var(--ink);
       font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
       display:grid;place-items:center;padding:24px}
  .karte{background:#fff;border:1px solid var(--rahmen);border-radius:16px;padding:30px 28px;
         max-width:440px;width:100%;text-align:center;box-shadow:0 2px 10px rgba(26,35,51,.06)}
  .logo{width:46px;height:46px;border-radius:11px;background:var(--blau);color:#fff;margin:0 auto 16px;
        display:grid;place-items:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;margin:0 0 6px}
  p{margin:0 0 6px;font-size:14.5px;color:var(--sek);line-height:1.5}
  .balken{height:4px;background:var(--rahmen);border-radius:99px;overflow:hidden;margin:20px 0 4px}
  .balken i{display:block;height:100%;width:35%;background:var(--blau);border-radius:99px;
            animation:lauf 1.1s ease-in-out infinite}
  @keyframes lauf{0%{margin-left:-35%}100%{margin-left:100%}}
  .fehler h1{color:var(--rot)}
  .fehler .balken{display:none}
  code{font-size:12px;color:var(--sek);word-break:break-all}
  button{margin-top:16px;font:inherit;font-size:15px;font-weight:600;padding:11px 22px;border-radius:11px;
         border:0;background:var(--blau);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="karte" id="box">
  <div class="logo">AS</div>
  <h1>Prozesslandkarte</h1>
  <p>Autohaus Stieber GmbH</p>
  <div class="balken"><i></i></div>
  <p id="stand">Anwendung wird geladen …</p>
</div>

<script>
/*  Einstiegsseite der Prozesslandkarte
 *
 *  Diese Seite ist bewusst winzig. Sie holt die Anwendung aus der Supabase
 *  Edge Function "prozesse" und zeigt sie an.
 *
 *  Warum dieser Weg - genau wie beim Qualitaetsmanagement-Dashboard:
 *   - GitHub Pages liefert HTML korrekt als text/html aus, laesst sich aber
 *     nur ueber einen Upload aktualisieren.
 *   - Supabase liefert HTML grundsaetzlich als text/plain aus; der Browser
 *     wuerde also nur den Quelltext anzeigen statt die Seite auszufuehren.
 *  Die Kombination loest beides: fester Link, jederzeit austauschbarer Inhalt.
 *
 *  Neue Fassung veroeffentlichen: nur die Zeilen index/css/js in der Tabelle
 *  pl_seite ersetzen. Dieser Link und diese Seite bleiben unveraendert.
 *
 *  Die Anmeldung steckt in der Anwendung selbst (Supabase Auth). Ohne
 *  Anmeldung und ohne Eintrag in pl_berechtigt gibt die Datenbank keinerlei
 *  Daten heraus - das setzt Row Level Security durch, nicht diese Seite.
 */

const QUELLE = 'https://mnglpqeqmoxccqnztqez.supabase.co/functions/v1/prozesse';

function fehler(titel, detail){
  const box = document.getElementById('box');
  box.className = 'karte fehler';
  box.innerHTML =
      '<div class="logo" style="background:#EC1C24">!</div>'
    + '<h1>' + titel + '</h1>'
    + '<p>Bitte in ein paar Minuten erneut versuchen. Bleibt es dabei, bitte Oliver Stieber informieren.</p>'
    + '<p><code>' + detail + '</code></p>'
    + '<button onclick="location.reload()">Erneut versuchen</button>';
}

(async function starten(){
  try{
    /* Zeitstempel als Cache-Brecher: so erscheint eine neue Fassung sofort. */
    const antwort = await fetch(QUELLE + '?v=' + Date.now(), { cache: 'no-store' });
    if(!antwort.ok) throw new Error('Server meldet Status ' + antwort.status);

    const html = await antwort.text();
    if(html.length < 5000 || html.indexOf('<html') === -1){
      throw new Error('Die geladene Datei sieht nicht wie die Anwendung aus (' + html.length + ' Zeichen)');
    }

    document.getElementById('stand').textContent = 'Wird geöffnet …';
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    fehler('Prozesslandkarte nicht erreichbar', (e && e.message) ? e.message : String(e));
  }
})();
</script>
</body>
</html>
