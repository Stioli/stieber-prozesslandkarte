<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prozesslandkarte · Autohaus Stieber</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- Anmeldung -->
<div id="tor" class="tor">
  <div class="karte">
    <div class="logo">AS</div>
    <h1>Prozesslandkarte</h1>
    <p class="sub">Autohaus Stieber GmbH</p>

    <div id="tor-laden" class="balken"><i></i></div>

    <form id="anmeldung" class="anmeldung" hidden>
      <label for="mail">Firmen-E-Mail-Adresse</label>
      <input id="mail" type="email" autocomplete="username" required
             placeholder="vorname.nachname@autohaus-stieber.de" spellcheck="false">
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit" id="knopf-anmelden">Anmelden</button>
      <p class="hinweis">Dieselben Zugangsdaten wie bei Ihren übrigen Stieber-Apps.</p>
      <p class="hinweis"><button type="button" class="alslink" data-akt="linkstatt">Passwort vergessen? Anmeldelink per E-Mail anfordern</button></p>
    </form>

    <div id="tor-meldung" class="tor-meldung" hidden></div>
  </div>
  <p class="fuss"><button type="button" class="alslink" data-akt="datenschutz-tor">Datenschutzhinweis</button></p>
</div>

<!-- Anwendung -->
<div id="app" hidden>
  <header class="rail">
    <div class="marke">
      <span class="logo klein">AS</span>
      <b>Prozesslandkarte</b>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-rechts">
      <span class="wer" id="wer"></span>
      <button class="knopf schlank" data-akt="abmelden">Abmelden</button>
    </div>
  </header>
  <main id="inhalt" class="wrap"></main>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
